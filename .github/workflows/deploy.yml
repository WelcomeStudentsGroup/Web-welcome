# Publica el sitio compilado en la rama `deploy`.
#
# Toolyx OS (Web → Constructor → Importar web → Desde GitHub) está conectado a esa
# rama: cada push aquí dispara su webhook y publica una versión nueva.
# La rama `deploy` solo contiene el resultado de `npm run build` (dist/); nunca se
# edita a mano. Ver docs/06-despliegue.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & publish to deploy branch
    runs-on: ubuntu-latest
    env:
      # Variables del repositorio (Settings → Secrets and variables → Actions → Variables).
      SITE_URL: ${{ vars.SITE_URL }}
      PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Push dist/ to the deploy branch
        working-directory: dist
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}: ${COMMIT_MSG%%$'\n'*}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
